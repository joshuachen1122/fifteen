# Fly.io config for the KXBTC15M agent. This is a NEW app; it does not deploy to rocket-trading.
#   fly apps create btc-15m-kalshi-agent
#   fly volumes create agent_data --region iad --size 1 -a btc-15m-kalshi-agent
#   fly secrets set ANTHROPIC_API_KEY=... KALSHI_KEY_ID=... KALSHI_PRIVATE_KEY="$(cat key.pem)" -a btc-15m-kalshi-agent
#   fly deploy
app = "btc-15m-kalshi-agent"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite+aiosqlite:////data/agent.db"
  PORT = "8080"
  LOG_LEVEL = "INFO"
  KALSHI_ENV = "prod"         # production market data; the Kalshi key is a production key
  TRADING_ENABLED = "false"     # boot default only; the dashboard toggle (persisted in agent.db) wins
  ALLOW_LIVE_TRADING = "true"   # server-side guard: set "false" to force paper regardless of the dashboard
  MAX_TRADE_USD = "1.00"        # default cap per order, price + fee (editable on the dashboard)
  MAX_DAILY_TRADE_USD = "100.00"  # default cap per UTC day (editable on the dashboard)
  # DASHBOARD_PASSWORD is a secret: fly secrets set DASHBOARD_PASSWORD=...

# SQLite lives on the volume, so run exactly one machine and never auto-stop it.
[mounts]
  source = "agent_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
